<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Авторизація / Реєстрація</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Форма користувача</p>
        <h1>Авторизація та реєстрація</h1>
        <p>Зручна, доступна та адаптивна форма для входу і створення облікового запису.</p>
      </div>
    </header>

    <div class="card">
      <div class="tabs" role="tablist" aria-label="Переходи між формами">
        <button class="tab active" role="tab" aria-selected="true" data-tab="register">Реєстрація</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="login">Авторизація</button>
      </div>

      <form id="registerForm" class="form active" novalidate>
        <h2>Реєстрація</h2>

        <div class="form-group">
          <label for="firstName">Ім’я</label>
          <input id="firstName" type="text" name="firstName" autocomplete="given-name" placeholder="Введіть ім’я" required />
          <small></small>
        </div>

        <div class="form-group">
          <label for="lastName">Прізвище</label>
          <input id="lastName" type="text" name="lastName" autocomplete="family-name" placeholder="Введіть прізвище" required />
          <small></small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" autocomplete="email" placeholder="example@mail.com" required />
          <small></small>
        </div>

        <div class="form-group password">
          <label for="password">Пароль</label>
          <span class="password-field">
            <input id="password" type="password" name="password" autocomplete="new-password" placeholder="Мінімум 6 символів" required />
            <button type="button" class="toggle" aria-label="Показати пароль">
              <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </span>
          <small></small>
        </div>

        <div class="form-group password">
          <label for="confirmPassword">Підтвердження паролю</label>
          <span class="password-field">
            <input id="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" placeholder="Повторіть пароль" required />
            <button type="button" class="toggle" aria-label="Показати підтвердження паролю">
              <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </span>
          <small></small>
        </div>

        <div class="form-group">
          <label for="phone">Телефон</label>
          <input id="phone" type="tel" name="phone" autocomplete="tel" placeholder="+380XXXXXXXXX" required />
          <small></small>
        </div>

        <div class="form-group">
          <label for="dob">Дата народження</label>
          <input id="dob" type="date" name="dob" required />
          <small></small>
        </div>

        <div class="form-group">
          <label for="sex">Стать</label>
          <select id="sex" name="sex" required>
            <option value="">Оберіть стать</option>
            <option value="male">Чоловіча</option>
            <option value="female">Жіноча</option>
          </select>
          <small></small>
        </div>

        <div class="form-group">
          <label for="country">Країна</label>
          <select id="country" name="country" required>
            <option value="">Оберіть країну</option>
          </select>
          <small></small>
        </div>

        <div class="form-group">
          <label for="city">Місто</label>
          <select id="city" name="city" disabled required>
            <option value="">Спершу оберіть країну</option>
          </select>
          <small></small>
        </div>

        <button type="submit" class="primary-btn">Зареєструватися</button>
      </form>

      <form id="loginForm" class="form" novalidate>
        <h2>Авторизація</h2>

        <div class="form-group">
          <label for="username">Ім’я користувача</label>
          <input id="username" type="text" name="username" autocomplete="username" placeholder="Ваш логін" required />
          <small></small>
        </div>

        <div class="form-group password">
          <label for="loginPassword">Пароль</label>
          <span class="password-field">
            <input id="loginPassword" type="password" name="loginPassword" autocomplete="current-password" placeholder="Мінімум 6 символів" required />
            <button type="button" class="toggle" aria-label="Показати пароль">
              <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </span>
          <small></small>
        </div>

        <div class="form-group checkbox">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" />
            Запам’ятати мене
          </label>
        </div>

        <button type="submit" class="primary-btn">Увійти</button>
      </form>
    </div>

    <div id="successMessage" class="status-message" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
